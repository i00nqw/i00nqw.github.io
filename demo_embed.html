    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        background: #0d0d1a;
        overflow: hidden;
        /* iOS WKWebView: a slow inventory drag is otherwise interpreted as a
           long-press and pops the native copy/share callout mid-gesture, and
           the drag selects surrounding text. */
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
        /* No safe-area padding: GAME_WIDTH is derived from the *full*
           window aspect, so the canvas only fits without bars when its
           container is the full viewport. Any padding here shrinks the
           container, the aspects stop matching, and the canvas gets
           letterboxed on all four sides. This selector also matches both
           html and body, so an inset would be subtracted twice. */
        padding: 0;
      }
      body { display: flex; justify-content: center; align-items: center; }
      /* Phaser scales the canvas with `transform: scale(...)`. Tell the
         browser to use nearest-neighbor when up-scaling so text stays
         crisp on high-DPR phones instead of bilinear-blurring. */
      canvas {
        height: 100% !important;
        width: auto !important;
        max-width: 100%;
        max-height: 100%;
        margin: 0 !important;
        padding: 0 !important;
        display: block !important;
        /* iOS ignores user-scalable=no in Safari; without this a two-finger
           pinch or double-tap zooms the canvas and desyncs pointer coords. */
        touch-action: none;
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
      }

      /* On portrait mobile screens (aspect ratio <= 0.65), fill edge-to-edge */
      @media (max-aspect-ratio: 13/20) {
        canvas {
          width: 100% !important;
          height: 100% !important;
          max-width: 100% !important;
          max-height: 100% !important;
        }
      }

      /* Landing page 3D phone embedding: strictly lock canvas to virtual phone screen ratio */
      html.is-landing-mode,
      html.is-landing-mode body {
        padding-top: 0 !important;
        padding-bottom: 0 !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        height: 100% !important;
        overflow: hidden !important;
      }
      html.is-landing-mode canvas {
        width: 100% !important;
        height: 100% !important;
        max-width: 100% !important;
        max-height: 100% !important;
        aspect-ratio: 390 / 844 !important;
        object-fit: contain !important;
        margin: auto !important;
      }
    </style>
